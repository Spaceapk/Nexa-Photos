name: Android CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests, lint and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --console=plain testDebugUnitTest 2>&1 | tee /tmp/build.log

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --console=plain lintDebug 2>&1 | tee -a /tmp/build.log

      - name: Assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --console=plain assembleDebug 2>&1 | tee -a /tmp/build.log

      - name: Publish build log as commit comment on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "Android CI falló en ${{ github.sha }} (run ${{ github.run_id }})."
            echo
            echo '```'
            grep -E "^(e: |w: )|FAILED|FAILURE:|Execution failed|Caused by:|What went wrong|error:" /tmp/build.log | tail -n 150 || true
            echo '--- últimas líneas ---'
            tail -n 120 /tmp/build.log || true
            echo '```'
          } > /tmp/comment.md
          jq -Rs '{body: .}' /tmp/comment.md > /tmp/comment.json
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            --input /tmp/comment.json > /dev/null || true

      - name: Verify APK identity
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::No se generó el APK debug"; exit 1; }
          AAPT2="$ANDROID_HOME/build-tools/34.0.0/aapt2"
          "$AAPT2" dump badging "$APK" | tee badging.txt
          grep -q "package: name='org.nexlibre.nexaphotos'" badging.txt || { echo "::error::applicationId inesperado"; exit 1; }
          grep -q "versionName='0.1.0'" badging.txt || { echo "::error::versionName inesperado"; exit 1; }
          echo "APK debug verificado: org.nexlibre.nexaphotos 0.1.0"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-Photos-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
